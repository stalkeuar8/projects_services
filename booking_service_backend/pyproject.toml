[tool.ruff]
line-length = 150
target-version = "py312" 

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F401"]
fixable = ["E", "I", "W"]
unfixable = ["F"]

[tool.mypy]
python_version = "3.12" 
strict = true 
ignore_missing_imports = true 
warn_return_any = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

plugins = [
  "pydantic.mypy"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
