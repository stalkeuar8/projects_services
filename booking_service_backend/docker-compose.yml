
services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_booking_service_db
    restart: no
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}   
      POSTGRES_DB: ${DB_NAME}    
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - booking_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: no
    ports:
      - "6379:6379"
    networks:
      - booking_network

  celery_worker:
    build: .
    command: celery -A app.background_tasks.celery_worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    networks:
      - booking_network
    restart: no
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  celery_beat:
    restart: no
    build: .
    command: celery -A app.background_tasks.celery_worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    networks:
      - booking_network
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_started

  migrations:
    restart: no
    build: .
    command: alembic upgrade head
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - booking_network
    environment:
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}

  app:
    restart: no
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - booking_network
    volumes:
      - .:/app

  bot:
    restart: no
    build: .
    command: watchfiles --ignore-paths "__pycache__" "python app/bot/bot_main.py" ./app
    expose:
      - "${BOT_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - BOT_PORT=${BOT_PORT}
    networks:
      - booking_network
    volumes:
      - .:/app

  ngrok:
    image: ngrok/ngrok:latest
    restart: no
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "bot:${BOT_PORT}"
    networks:
      - booking_network
    ports:
      - "4040:4040"
    depends_on:
      - bot

networks:
  booking_network:
    driver: bridge

volumes:
  postgres_data: