
services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_booking_service_db
    restart: no
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}   
      POSTGRES_DB: ${DB_NAME}    
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - booking_network
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - booking_network

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - booking_network
    volumes:
      - .:/app

  bot:
    build: .
    command: python app/bot/bot_main.py
    depends_on:
      - postgres
      - app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
networks:
  booking_network:
    driver: bridge

volumes:
  postgres_data: 
